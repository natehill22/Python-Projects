{% extends "base.html" %}

{% block title %}My Site{% endblock %}
{% block header %}Create a New Product:{% endblock %}

{% block content %}


    <form method="POST" action="{% url 'createRecord' %}">
        <div>
            {% csrf_token %}<!--Cross Site Request Forgery protection-->
            {{ form.non_field_errors }} <!--Displays global form errors not tied to a specific field-->
            {{ form.as_p }} <!--Renders and displays the form object as a form field-->
        </div>
        <div>
            <input type="submit" class="btn" value="Create New Profile" name="Save_Item">
            <!--Clicking Cancel brings users back to the home page-->
            <a href="{% url 'home' %}"><button type="button" class="btn" value="Cancel">Cancel</button></a>
        </div>
    </form>


{% endblock %}
