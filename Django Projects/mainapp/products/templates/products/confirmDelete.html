{% extends "base.html" %}

{% block title %}Royal Hotels{% endblock %}
{% block header %}Delete Confirmation:{% endblock %}

{% block content %}

    <form method="POST" action="."> <!--Form data should be sent via POST request to the method that triggered it-->
        {% csrf_token %} <!--Security mechanism used within HTML POST forms to prevent Cross-Site Request Forgery attacks-->
        <h2>Confirm Delete</h2>
        <p>Are you sure you would like to delete "{{ item.name }}" from the database?</p> <!--Returns text with Product name piped in-->

        {{ item.as_p }} <!--Renders and displays the item object as a form field-->

        <input type="submit" value="Yes, delete it!" class="btn">
        <!--Clicking Cancel brings users back to the admin console-->
        <a href="{% url 'admin_console' %}"><button class="btn" type="button">Cancel</button></a>
    </form>


{% endblock %}
